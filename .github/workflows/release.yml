name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      SIGNING_FPR: ${{ secrets.RELEASE_SIGNING_FPR }}
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel clang lld llvm \
            mingw-w64-headers mingw-w64-crt systemd github-cli git
      - uses: actions/checkout@v7
      - name: Release notes
        run: ./packaging/release-notes.sh "$GITHUB_REF_NAME" >notes.md
      - name: Build
        run: ./build.sh
      - name: Tarball and checksums
        run: ./packaging/make-dist.sh "$GITHUB_REF_NAME"
      - name: Sign the checksums
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::notice::RELEASE_SIGNING_KEY is not set; checksums stay unsigned and the pacman repository is not updated"
            exit 0
          fi
          echo "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign dist/SHA256SUMS
      - name: Publish the release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files="dist/desktop-mate-linux-${GITHUB_REF_NAME}.tar.gz dist/SHA256SUMS"
          [ -f dist/SHA256SUMS.asc ] && files="$files dist/SHA256SUMS.asc"
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" --notes-file notes.md
      - name: Update the pacman repository
        if: env.SIGNING_KEY != ''
        run: |
          gh release view repo >/dev/null 2>&1 ||
            gh release create repo --prerelease --title "pacman repository" \
              --notes "Pacman repository for Arch-based systems. See the README for setup."
          mkdir -p build/repo
          (cd build/repo && gh release download repo -p 'desktop-mate-linux.db.tar.gz' -p 'desktop-mate-linux.files.tar.gz') || true
          old=$(gh release view repo --json assets -q '.assets[].name' | grep '\.pkg\.tar\.zst' || true)
          pkg=$(./packaging/arch/build-repo.sh "$GITHUB_REF_NAME" "$SIGNING_FPR" build/repo | tail -n 1)
          gh release upload repo --clobber build/repo/*
          for a in $old; do
            case "$a" in "$pkg"|"$pkg.sig") ;; *) gh release delete-asset repo "$a" --yes ;; esac
          done
